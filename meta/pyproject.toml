[build-system]
build-backend = "scikit_build_core.build"
requires = [ "scikit-build-core>=0.11", "setuptools-scm>=8" ]

[project]
name = "obdeect"
description = "Cherenkov-telescope light simulation: all obdeect components"
readme = "README.md"
license = { file = "LICENSE" }
authors = [ { name = "obdeect contributors" } ]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "dependencies", "version" ]

[tool.setuptools_scm]
root = ".."
fallback_version = "0.1.0"

[tool.scikit-build]
sdist.include = [ "README.md", "LICENSE" ]
# No code: this package only installs all components at the same version.
wheel.cmake = false
wheel.packages = []
metadata.dependencies.provider = "scikit_build_core.metadata.template"
metadata.dependencies.result = [
  "obdeect-propagation=={project[version]}",
  "obdeect-ray-tracing=={project[version]}",
  "obdeect-sources=={project[version]}",
  "obdeect-stream=={project[version]}",
]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.pyproject-fmt]
max_supported_python = "3.15"
