---
name: CI-docs
# Builds the documentation of each component. One combined site with deployment follows
# when the component documentation is merged.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        component: [stream, propagation, sources, ray_tracing]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.14"
      - name: Install the components with the documentation tools
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install ./src/stream "./src/${{ matrix.component }}[docs]"
      - name: Build the documentation
        run: sphinx-build -W --keep-going -b html src/${{ matrix.component }}/docs src/${{ matrix.component }}/docs/_build/html
