---
name: CI-docs
# Publish dev and release documentation together, preserving root URLs.

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.14"
      - name: Install all components with the documentation tools
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install ./src/stream ./src/propagation ./src/sources
          "./src/ray_tracing[docs]"
      - name: Test documentation publishing
        run: |
          python -m pip install pytest
          python -m pytest -q src/ray_tracing/python/tests/test_docs_versions.py
      - name: Build versioned site
        env:
          DOCS_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          args=(--output docs/_build/site --base-url "$DOCS_BASE_URL")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            args+=(--dev-ref origin/main)
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--dev-only)
          fi
          python docs/build_versions.py "${args[@]}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: docs/_build/site

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
