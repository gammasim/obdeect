---
name: CI-linter

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        id: setup-python
        with:
          python-version: '3.14'
      - name: Install linters
        run: python -m pip install --retries 5 --upgrade pip pre-commit clang-format
      # Hook environments are built once per .pre-commit-config.yaml; some hooks
      # download binaries at install time, so a fresh build on every run fails often.
      - name: Cache hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run repository hooks
        run: pre-commit run --all-files
      - name: Check C++ formatting
        run: >-
          find src -path '*/cpp/*' -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0
          | xargs -0 clang-format --dry-run --Werror
