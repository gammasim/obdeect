[build-system]
build-backend = "scikit_build_core.build"
requires = [ "nanobind>=3.1", "scikit-build-core>=0.11", "setuptools-scm>=8" ]

[project]
name = "obdeect-ray-tracing"
description = "Ray tracing for imaging atmospheric Cherenkov telescopes"
readme = "README.md"
license = { file = "LICENSE" }
authors = [ { name = "obdeect contributors" } ]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "dependencies", "version" ]
optional-dependencies.dev = [ "nanobind>=3.1", "pre-commit", "pytest", "ruff" ]
optional-dependencies.docs = [ "myst-parser", "pydata-sphinx-theme", "pyyaml", "sphinx", "sphinx-design" ]
optional-dependencies.figures = [ "astropy", "matplotlib>=3.8" ]
optional-dependencies.plot = [ "matplotlib>=3.8" ]
scripts.obdeect = "obdeect.ray_tracing.cli:main"

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.1.0"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.args = [ "-DOBDEECT_RAY_TRACING_BUILD_TESTING=OFF" ]
cmake.build-type = "Release"
sdist.include = [ "cpp/**", "CMakeLists.txt", "python/**", "README.md", "LICENSE" ]
wheel.packages = { "obdeect/ray_tracing" = "python/obdeect/ray_tracing" }
wheel.platlib = true
# Editable installs rebuild the extension when the C++ sources change.
editable.rebuild = true
editable.verbose = false

[tool.cibuildwheel]
# Oldest macOS release supported by the binary wheels.
macos.environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[tool.ruff]
target-version = "py314"
line-length = 100
preview = true
lint.select = [ "E", "F", "I", "UP" ]

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.towncrier]
package = "obdeect.ray_tracing"
package_dir = "python"
directory = "docs/changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"
underlines = [ "", "", "" ]
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "maintenance", name = "Maintenance", showcontent = true },
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.scikit-build.metadata.dependencies]
# All components are released together with one version.
provider = "scikit_build_core.metadata.template"
result = [ "numpy>=2.3", "obdeect-stream=={project[version]}" ]
