[build-system]
build-backend = "scikit_build_core.build"
requires = [ "nanobind>=3.1", "scikit-build-core>=0.10", "setuptools-scm>=8" ]

[project]
name = "gstrickd"
description = "Photon-stream format and I/O for Cherenkov-telescope simulation chains"
readme = "README.md"
license = { file = "LICENSE" }
authors = [ { name = "gstrickd contributors" } ]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [
  "numpy>=2.3",
]
optional-dependencies.dev = [ "nanobind>=3.1", "pre-commit", "pytest", "ruff" ]
optional-dependencies.docs = [ "myst-parser", "pydata-sphinx-theme", "pyyaml", "sphinx" ]
optional-dependencies.plot = [ "matplotlib>=3.8" ]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.1.0"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.args = [ "-DGSTRICKD_BUILD_TESTING=OFF" ]
cmake.build-type = "Release"
sdist.include = [ "cmake/**", "cpp/**", "CMakeLists.txt", "python/**", "README.md", "LICENSE" ]
wheel.packages = [ "python/gstrickd" ]
wheel.platlib = true
# Editable installs rebuild the extension when the C++ sources change.
editable.rebuild = true
editable.verbose = false

[tool.cibuildwheel]
# Oldest macOS release supported by the binary wheels.
macos.environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[tool.ruff]
target-version = "py314"
line-length = 100
preview = true
lint.select = [ "E", "F", "I", "UP" ]

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.towncrier]
package = "gstrickd"
package_dir = "python"
directory = "docs/changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"
underlines = [ "", "", "" ]
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "maintenance", name = "Maintenance", showcontent = true },
]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"
