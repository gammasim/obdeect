[build-system]
build-backend = "scikit_build_core.build"
requires = [ "nanobind>=3.1", "scikit-build-core>=0.11", "setuptools-scm>=8" ]

[project]
name = "obdeect-stream"
description = "Photon-stream format and I/O for Cherenkov-telescope simulation chains"
readme = "README.md"
license = "BSD-3-Clause"
authors = [ { name = "obdeect contributors" } ]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [
  "numpy>=2.3",
]
optional-dependencies.dev = [ "nanobind>=3.1", "pre-commit", "pytest", "ruff" ]
optional-dependencies.docs = [ "myst-parser", "pydata-sphinx-theme", "pyyaml", "sphinx" ]
optional-dependencies.plot = [ "matplotlib>=3.8" ]
scripts.obdeect = "obdeect.stream.cli:main"
entry-points."obdeect.commands".stream = "obdeect.stream.cli:group"

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.1.0"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.args = [ "-DOBDEECT_STREAM_BUILD_TESTING=OFF" ]
cmake.build-type = "Release"
sdist.include = [ "cmake/**", "cpp/**", "CMakeLists.txt", "python/**", "README.md" ]
wheel.packages = { "obdeect/stream" = "python/obdeect/stream" }
wheel.platlib = true
# Editable installs rebuild the extension when the C++ sources change.
editable.rebuild = true
editable.verbose = false
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

