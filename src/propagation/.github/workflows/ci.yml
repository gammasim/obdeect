---
name: CI-linter

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install linters
        run: python -m pip install --retries 5 --upgrade pip pre-commit clang-format
      # Hook environments are built once per .pre-commit-config.yaml; some hooks
      # download binaries at install time, so a fresh build on every run fails often.
      - name: Cache hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install hook environments
        run: |
          for attempt in 1 2 3; do
            pre-commit install-hooks && exit 0
            echo "pre-commit install-hooks failed (attempt ${attempt}); retrying in 60 s"
            sleep 60
          done
          exit 1
      - name: Run repository hooks
        run: pre-commit run --all-files
      - name: Check C++ formatting
        run: >-
          find cpp -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0
          | xargs -0 clang-format --dry-run --Werror
