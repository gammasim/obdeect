[build-system]
build-backend = "scikit_build_core.build"
requires = [ "scikit-build-core>=0.11", "setuptools-scm>=8" ]

[project]
name = "obdeect"
description = "Cherenkov-telescope light simulation: all obdeect components"
readme = "README.md"
license = "BSD-3-Clause"
license-files = [ "LICENSE" ]
authors = [ { name = "obdeect contributors" } ]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "dependencies", "version" ]

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.scikit-build]
sdist.include = [ "README.md", "LICENSE" ]
# No code: this package only installs all components at the same version.
wheel.cmake = false
wheel.packages = []
metadata.dependencies.provider = "scikit_build_core.metadata.template"
metadata.dependencies.result = [
  "obdeect-propagation=={project[version]}",
  "obdeect-ray-tracing=={project[version]}",
  "obdeect-sources=={project[version]}",
  "obdeect-stream=={project[version]}",
]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

# Settings shared by all components (src/*/pyproject.toml).

[tool.cibuildwheel]
# Oldest macOS release supported by the binary wheels.
macos.environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }
# The plot tests need matplotlib, which has no musllinux wheels (a source build
# needs network downloads); they are skipped there.
test-requires = [ "matplotlib", "pytest" ]
overrides = [ { select = "*-musllinux_*", test-requires = [ "pytest" ] } ]

[tool.ruff]
target-version = "py314"
line-length = 100
preview = true
lint.select = [ "E", "F", "I", "UP" ]

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.towncrier]
directory = "docs/changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"
underlines = [ "", "", "" ]
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "maintenance", name = "Maintenance", showcontent = true },
]
